<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ElevenRoute: a black sphere lit by the three providers it routes to (OpenAI teal, Google violet, Anthropic orange). -->
  <defs>
    <radialGradient id="b" cx="32%" cy="26%" r="85%">
      <stop offset="0" stop-color="#4a4643"/>
      <stop offset=".35" stop-color="#161413"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="t" cx="74%" cy="22%" r="34%">
      <stop offset="0" stop-color="#3fc1b4" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#3fc1b4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#3fc1b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v" cx="80%" cy="76%" r="34%">
      <stop offset="0" stop-color="#7a5cff" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#7a5cff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o" cx="18%" cy="66%" r="34%">
      <stop offset="0" stop-color="#ff6a2b" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#ff6a2b" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s" cx="34%" cy="28%" r="18%">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30.5" fill="url(#b)"/>
  <circle cx="32" cy="32" r="30.5" fill="url(#t)"/>
  <circle cx="32" cy="32" r="30.5" fill="url(#v)"/>
  <circle cx="32" cy="32" r="30.5" fill="url(#o)"/>
  <circle cx="32" cy="32" r="30.5" fill="url(#s)"/>
